# ── Efectech – Docker Compose ─────────────────────────────────────
# Usage:  docker compose up -d
# Update: docker compose pull && docker compose up -d --build

services:
  web:
    build: .
    image: efectech-web:latest
    container_name: efectech-web
    restart: unless-stopped
    ports:
      - "8089:80"     # Cloudflare Tunnel → port 8089 on your server
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro        # editar HTML sin rebuild
      - ./images:/usr/share/nginx/html/images:ro                # logos y assets en vivo
      - nginx_logs:/var/log/nginx
    environment:
      - TZ=America/Lima
    labels:
      - "com.efectech.service=website"
      - "com.efectech.env=production"

volumes:
  nginx_logs:
