# ── Efectech – Docker Compose ─────────────────────────────────────
# Usage:  docker compose up -d
# Update: docker compose pull && docker compose up -d --build

services:
  web:
    build: .
    image: efectech-web:latest
    container_name: efectech-web
    restart: unless-stopped
    ports:
      - "80:80"       # Cloudflare proxy → port 80 on your server
    volumes:
      # Optional: mount index.html directly for quick edits without rebuild
      # - ./index.html:/usr/share/nginx/html/index.html:ro
      - nginx_logs:/var/log/nginx
    environment:
      - TZ=America/Lima
    labels:
      - "com.efectech.service=website"
      - "com.efectech.env=production"

volumes:
  nginx_logs:
