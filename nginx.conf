# ── Nginx config for Efectech (behind Cloudflare proxy) ──────────
server {
    listen 80;
    server_name _;          # matches any hostname (Cloudflare sends HTTP internally)

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/html text/css text/javascript application/javascript
               application/json image/svg+xml font/woff2;

    # Cache static assets
    location ~* \.(css|js|woff2?|ttf|eot|svg|ico|png|jpg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Main entry point – SPA friendly (always serve index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers (Cloudflare also adds some, these are extras)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide Nginx version
    server_tokens off;

    # Custom 404
    error_page 404 /index.html;
}
